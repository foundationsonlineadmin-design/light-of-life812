<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a1e0d">
  <meta name="description" content="Explore the Bible together, one discovery at a time.">
  <script>(()=>{let lang=new URLSearchParams(location.search).get('lang');if(lang!=='hi'&&lang!=='en'){try{lang=localStorage.getItem('lol-discovery-language-v1')}catch{}}lang=lang==='hi'?'hi':'en';const manifest=document.createElement('link');manifest.rel='manifest';manifest.href=`manifest-${lang}.webmanifest`;document.head.append(manifest)})();</script>
  <link rel="icon" href="assets/english-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>(()=>{const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;if(!standalone||location.hash)return;try{const lang=localStorage.getItem("lol-discovery-language-v1");if(lang==="hi"||lang==="en")location.replace(`home.html?lang=${lang}`)}catch{}})();</script>
  <title>Choose a language — Light of Life</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="header-home-nav">
        <button class="icon-btn back-shortcut" type="button" aria-label="Go back" title="Go back">←</button>
        <a class="brand" href="index.html" aria-label="Light of Life home"><span class="brand-mark" aria-hidden="true">✦</span></a>
      </div>
      <div class="top-actions">
        <button id="install-btn" class="install-btn" hidden>Install app</button><button class="icon-btn qr-code-shortcut" type="button" aria-label="Show website QR code" aria-haspopup="dialog" aria-expanded="false" aria-controls="qr-code-dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h3v3h-3zm5 0h3v2h-3zm-5 5h2v3h-2zm3-2h2v2h-2zm3 2h2v3h-2zm2-3h2v2h-2z"/></svg></button><div class="text-size-control"><button id="text-size-toggle" class="text-size-toggle" aria-label="Text size" aria-expanded="false" aria-controls="text-size-panel">Aa</button><div id="text-size-panel" class="text-size-panel" role="group" aria-label="Text size controls" hidden><div class="text-size-panel-title">Text size</div><div class="text-size-buttons"><button id="text-size-decrease" aria-label="Decrease text size">A−</button><output id="text-size-value" aria-live="polite">100%</output><button id="text-size-increase" aria-label="Increase text size">A+</button></div><button id="text-size-reset" class="text-size-reset">Reset</button></div></div>
        <a class="icon-btn language-shortcut" href="#language" aria-label="Choose language">आ</a>
        <a class="icon-btn tracking-shortcut" href="index.html#progress" aria-label="Your progress"><img src="assets/group-button.png" alt=""></a>
        <button class="icon-btn" id="share-btn" aria-label="Share this page">↗</button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <a href="index.html" data-nav="home"><span>⌂</span>Home</a>
      <a href="#progress" data-nav="progress"><span>◷</span>Progress</a>
    </nav>
    <footer class="site-footer"><span>✦ <b>LIGHT OF LIFE</b></span></footer>
  </div>
  <script src="catalog.js"></script>
  <script src="progress-store.js"></script>
  <script src="install.js"></script>
  <script src="app.js"></script><script src="brand-language.js"></script>
  <script src="share-page.js"></script>
  <script src="header-nav.js"></script><script src="text-size.js"></script>
</body>
</html>
